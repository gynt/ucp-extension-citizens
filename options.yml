meta:
  version: 1.0.0
options:
  - display: GroupBox
    header: '{{ui.citizens}}'
    text: '{{ui.control-citizens-non-military-units}}'
    hasHeader: true
    category: ['{{ui.citizens}}']
    children:
    - display: GroupBox
      header: '{{ui.control-spawning}}'
      text: '{{ui.control-spawning-of-potentially-annoying-units}}'
      children:
        - url: citizens.spawn.disable.child
          text: '{{ui.disable-spawning-of-children}}'
          hasHeader: false
          display: Switch
          contents:
            type: boolean
            value: false
        - url: citizens.spawn.disable.mother
          text: '{{ui.disable-spawning-of-mothers}}'
          hasHeader: false
          display: Switch
          contents:
            type: boolean
            value: false
        - url: citizens.spawn.disable.drunk
          text: '{{ui.disable-spawning-of-drunk-people}}'
          hasHeader: false
          display: Switch
          contents:
            type: boolean
            value: false
        - url: citizens.spawn.disable.chicken
          text: '{{ui.disable-spawning-of-chickens}}'
          hasHeader: false
          display: Switch
          contents:
            type: boolean
            value: false
        - url: citizens.spawn.disable.jester
          text: '{{ui.disable-spawning-of-the-jester}}'
          hasHeader: false
          display: Switch
          contents:
            type: boolean
            value: false